spring:
  application.name: claims-service
  datasource:
    url: ${CLAIMS_DB_URL:jdbc:mysql://localhost:3306/claims}
    username: ${CLAIMS_DB_USER:claims}
    password: ${CLAIMS_DB_PASSWORD:claims}
    hikari.maximum-pool-size: 20
  threads.virtual.enabled: true
server:
  port: ${PORT:8081}
  shutdown: graceful
management:
  endpoint.health.probes.enabled: true
  tracing:
    # Traces are sent only when the endpoint is set.
    enabled: ${TRACING_ENABLED:false}
    sampling.probability: 0.1
  otlp.tracing.endpoint: ${OTLP_ENDPOINT:http://localhost:4318/v1/traces}
warranty:
  pricing-url: ${PRICING_URL:http://localhost:8082}
  queues:
    endpoint: ${SQS_ENDPOINT:}
    replay-url: ${REPLAY_QUEUE_URL:}
    compare-url: ${COMPARE_QUEUE_URL:}
  jobs.enabled: true
resilience4j:
  circuitbreaker.instances.pricing:
    sliding-window-size: 20
    minimum-number-of-calls: 10
    failure-rate-threshold: 50
    wait-duration-in-open-state: 10s
    ignore-exceptions: warranty.commons.ApiException
  retry.instances.pricing:
    max-attempts: 2
    wait-duration: 100ms
    ignore-exceptions: warranty.commons.ApiException
springdoc:
  packages-to-scan: warranty.claims.api
  default-produces-media-type: application/json
