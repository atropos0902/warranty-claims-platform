name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  java:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21, cache: maven }
      - run: mvn -B verify -Pmutation
        working-directory: platform
      - run: mvn -B package
        working-directory: legacy/app
  web:
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - name: Generated client matches the contracts
        run: npm run api && git diff --exit-code src/api
      - run: npm run check
      - run: npm test
      - run: npm run build
  infra:
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: infra } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm, cache-dependency-path: infra/package-lock.json }
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run synth
  stack:
    name: both systems together
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21, cache: maven }
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - uses: astral-sh/setup-uv@v6
      - run: make up
      # Before any group moves, because a moved group refuses the parity rows.
      - run: make parity
      - run: make migration-check
      - run: make demo
      - run: make load
      - run: make eval
      - run: make e2e
      - if: failure()
        run: docker compose logs --tail 200
  deploy:
    if: github.ref == 'refs/heads/main' && vars.AWS_DEPLOY_ROLE != ''
    needs: [java, web, infra, stack]
    runs-on: ubuntu-24.04
    environment: production
    permissions: { contents: read, id-token: write }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - uses: aws-actions/configure-aws-credentials@v5
        with: { role-to-assume: "${{ vars.AWS_DEPLOY_ROLE }}", aws-region: "${{ vars.AWS_REGION }}" }
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push
        run: |
          for pair in pricing:pricing-service claims:claims-service assistant:assistant-service migration:migration-worker; do
            docker build -t "$REGISTRY/warranty/${pair%%:*}:$GITHUB_SHA" --build-arg MODULE="${pair##*:}" platform
            docker push "$REGISTRY/warranty/${pair%%:*}:$GITHUB_SHA"
          done
          docker build -t "$REGISTRY/warranty/web:$GITHUB_SHA" web
          docker push "$REGISTRY/warranty/web:$GITHUB_SHA"
        env: { REGISTRY: "${{ steps.ecr.outputs.registry }}" }
      - run: npm ci && npx cdk deploy --all --require-approval never -c stage=prod -c imageTag="$GITHUB_SHA" -c bedrockModel="$MODEL"
        working-directory: infra
        env: { MODEL: "${{ vars.BEDROCK_MODEL }}" }
