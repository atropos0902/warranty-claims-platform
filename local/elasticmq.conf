include classpath("application.conf")
queues {
  "replay.fifo"  { fifo = true, contentBasedDeduplication = false, defaultVisibilityTimeout = 30 seconds, deadLettersQueue { name = "replay-dead.fifo", maxReceiveCount = 5 } }
  "replay-dead.fifo" { fifo = true }
  "compare.fifo" { fifo = true, contentBasedDeduplication = false, defaultVisibilityTimeout = 30 seconds, deadLettersQueue { name = "compare-dead.fifo", maxReceiveCount = 5 } }
  "compare-dead.fifo" { fifo = true }
}
